<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Party Games</title>
<link rel="stylesheet" href="/static/style.css?v=4" />
</head>
<body>
<header class="topbar">
  <h1 class="brand">🎮 <span class="brand-text">Party Games</span></h1>
  <div id="connection-status" class="status-pill offline"><span class="status-dot"></span>connecting…</div>
</header>

<main id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <div class="hero">
      <h2 class="hero-title">Jump into a game</h2>
      <p class="hero-sub">Pick a game, share the room code, play together in real time.</p>
    </div>

    <div class="panel nickname-panel">
      <label for="nickname">Your name</label>
      <div class="nickname-row">
        <div id="nickname-avatar" class="mini-avatar"></div>
        <input id="nickname" maxlength="20" placeholder="e.g. Shreya" autocomplete="off" />
      </div>
    </div>

    <h2 class="section-title">Choose a game to host</h2>
    <div id="game-grid" class="game-grid"></div>

    <div class="panel join-panel">
      <div class="divider"><span>or join a friend's room</span></div>
      <div class="join-row">
        <input id="join-code" maxlength="4" placeholder="ROOM CODE" autocomplete="off" />
        <button id="join-btn">Join →</button>
      </div>
    </div>

    <p id="home-error" class="error-text"></p>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen hidden">
    <div class="panel lobby-panel">
      <div class="room-code-box">
        <div>
          <span>Room Code</span>
          <strong id="lobby-room-code">----</strong>
        </div>
        <button id="copy-code-btn" class="copy-btn" type="button">Copy</button>
      </div>
      <div class="lobby-game-heading">
        <span id="lobby-game-icon" class="lobby-game-icon"></span>
        <div>
          <h2 id="lobby-game-name">Game</h2>
          <p id="lobby-game-desc" class="muted"></p>
        </div>
      </div>
      <h3>Players <span id="lobby-player-count" class="muted"></span></h3>
      <ul id="lobby-players" class="player-list"></ul>
      <button id="start-game-btn" class="primary hidden">▶ Start Game</button>
      <p id="lobby-wait-text" class="muted waiting-text">Waiting for host to start<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
      <p id="lobby-error" class="error-text"></p>
      <button id="leave-lobby-btn" class="secondary">Leave</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen hidden">
    <div id="game-root" class="panel"></div>
    <p id="game-error" class="error-text"></p>
  </section>

  <!-- GAME OVER -->
  <section id="screen-gameover" class="screen hidden">
    <div class="panel">
      <h2 id="gameover-title">Game Over</h2>
      <p id="gameover-detail" class="muted"></p>
      <div id="gameover-extra"></div>
      <button id="play-again-btn" class="primary hidden">Play Again</button>
      <button id="back-home-btn" class="secondary">Back to Home</button>
    </div>
  </section>

</main>

<script src="/static/app.js?v=4"></script>
</body>
</html>
